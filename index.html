<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Thumpinu ❤️</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.2);
max-width:500px;
animation:fade 2s;
}

h1{
color:#ff3366;
}

p{
font-size:20px;
color:#444;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:50px;
background:#ff3366;
color:white;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#ff4f7b;
}

#message{
display:none;
margin-top:25px;
font-size:22px;
color:#ff3366;
}

@keyframes fade{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}
</style>

</head>

<body>

<div class="card">
<h1>Happy Girlfriend's Day ❤️</h1>

<p>
My Dearest Thumpinu ❤️<br><br>
You are the most beautiful part of my life.
Every heartbeat of mine whispers your name.
</p>

<button onclick="showLove()">Tap Me ❤️</button>

<div id="message">
❤️ I Love You Forever Thumpinu ❤️
</div>

</div>

<script>
function showLove(){
document.getElementById("message").style.display="block";
}
</script>

</body>
</html>
